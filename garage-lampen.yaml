substitutions:
  device_name: garage-lampen
  ha_name: Garage lampen
  
esphome:
  name: '${device_name}'
esp8266:
  board: esp8285


wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  post_connect_roaming: false
  reboot_timeout: 0s

logger:
  baud_rate: 0

api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password
    
output:
  - platform: gpio
    pin: GPIO4
    id: relay

light:
  - platform: binary
    name: Light
    output: relay
    id: lightid
    restore_mode: always_off

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO5
      #mode: INPUT_PULLUP
      #inverted: True
    name: Switch
    on_state:
      then:
        - light.toggle: lightid
    internal: true
    id: switchid