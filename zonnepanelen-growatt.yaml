substitutions:
  name: zonnepanelen-growatt
  friendly_name: zonnepanelen-growatt

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp07s

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  post_connect_roaming: false
  reboot_timeout: 0s
  reboot_timeout: 0s

api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

captive_portal:

# UART0 wordt gebruikt voor Modbus — logging op serieel uitzetten
logger:
  baud_rate: 0

uart:
  id: mod_bus
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  stop_bits: 1

modbus:
  id: modbus1
  uart_id: mod_bus

modbus_controller:
  - id: growatt
    address: 0x1
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 10s

output:
  - id: led_blauw
    platform: gpio
    pin: GPIO16
  - id: led_groen
    platform: gpio
    pin: GPIO0
    inverted: true
  - id: led_rood
    platform: gpio
    pin: GPIO2
    inverted: true

sensor:
  - platform: modbus_controller
    modbus_controller_id: growatt
    name: DC vermogen
    address: 1
    register_type: read
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:solar-power
    value_type: U_DWORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: DC spanning
    address: 3
    register_type: read
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    icon: mdi:flash
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: DC stroom
    address: 4
    register_type: read
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    icon: mdi:current-dc
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: AC frequentie
    address: 13
    register_type: read
    unit_of_measurement: Hz
    device_class: frequency
    state_class: measurement
    icon: mdi:sine-wave
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: AC spanning
    address: 14
    register_type: read
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    icon: mdi:flash
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: AC stroom
    address: 15
    register_type: read
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    icon: mdi:current-ac
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: AC vermogen
    address: 16
    register_type: read
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:solar-power-variant
    value_type: U_DWORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: Energie vandaag
    address: 26
    register_type: read
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    icon: mdi:solar-power
    value_type: U_DWORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: Energie totaal
    address: 28
    register_type: read
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    icon: mdi:counter
    value_type: U_DWORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: Temperatuur
    address: 32
    register_type: read
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    icon: mdi:thermometer
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
