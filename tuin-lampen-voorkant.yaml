substitutions:
  device_name: tuin-lampen-voorkant
  ha_name: Tuin lampen voorkant
  
esphome:
  name: '${device_name}'
esp8266:
  board: esp8285


wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  post_connect_roaming: false
  reboot_timeout: 0s

logger:
  baud_rate: 0

api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password
    
uart:
    tx_pin: 1
    rx_pin: 3
    baud_rate: 115200

sensor:

light:
    - platform: shelly_dimmer
      name: '${ha_name}'
      id: thislight
      min_brightness: 500
      max_brightness: 1000
      firmware:
        version: "51.6"
        update: true