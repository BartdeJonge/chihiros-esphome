substitutions:
  device_name: aquarium-ups

esphome:
  name: ${device_name}

esp8266:
  board: esp8285

safe_mode:
  disabled: true

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  post_connect_roaming: false
  reboot_timeout: 0s

logger:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    name: "Button"
    on_press:
      - switch.toggle: relay

output:
  - platform: esp8266_pwm
    id: green_led
    pin:
      number: GPIO13
      inverted: True

switch:
  - platform: gpio
    name: "Schakelaar"
    pin: GPIO12
    id: relay
    restore_mode: RESTORE_DEFAULT_ON

light:
  - platform: monochromatic
    name: "Led"
    output: green_led
    id: led
