substitutions:
  device_name: hal-rolluik-ups

esphome:
  name: '${device_name}'
  on_boot:
    then:
      - switch.turn_on: relay

esp8266:
  board: esp8285

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  post_connect_roaming: false
  reboot_timeout: 0s

safe_mode:
  disabled: true

logger:
  baud_rate: 0

api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

time:
  - platform: homeassistant
    id: homeassistant_time

binary_sensor:
  - platform: gpio
    name: "Button"
    id: button
    pin:
      number: GPIO0
      inverted: true
    on_press:
      then:
        - switch.toggle: relay

switch:
  - platform: gpio
    pin: GPIO12
    restore_mode: RESTORE_DEFAULT_ON
    id: relay
    name: 'Schakelaar'
    on_turn_on:
      - output.turn_on: led
    on_turn_off:
      - output.turn_off: led

output:
  - platform: gpio
    pin: GPIO13
    inverted: true
    id: led

status_led:
  pin:
    number: GPIO2
    inverted: true
