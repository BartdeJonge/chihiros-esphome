substitutions:
  device_name: rflink
  
esphome:
  name: '${device_name}'

esp8266:
  board: nodemcuv2

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  post_connect_roaming: false
  reboot_timeout: 0s

logger:
  baud_rate: 0

api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password
    
external_components:
  - source: github://oxan/esphome-stream-server
  
uart:
   id: uart_bus
   baud_rate: 57600
   tx_pin: GPIO01
   rx_pin: GPIO03

stream_server:
   uart_id: uart_bus
   port: 1234