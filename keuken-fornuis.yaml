substitutions:
  device_name: keuken-fornuis

esphome:
  name: '${device_name}'

esp8266:
  board: esp01_1m
  restore_from_flash: true

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  reboot_timeout: 0s

logger:
  baud_rate: 0
  level: WARN

api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

i2c:
  sda: GPIO12
  scl: GPIO14

sensor:
  - platform: ade7953_i2c
    irq_pin: GPIO13
    update_interval: 5s
    voltage:
      name: Voltage
      filters:
        - throttle: 30s
    current_a:
      name: Stroom fase 1
      filters:
        - throttle: 5s
    active_power_a:
      name: Vermogen fase 1
      id: fornuis_vermogen_a
      filters:
        - throttle: 5s
    current_b:
      name: Stroom fase 2
      filters:
        - throttle: 5s
    active_power_b:
      name: Vermogen fase 2
      id: fornuis_vermogen_b
      filters:
        - throttle: 5s

  - platform: template
    name: Vermogen totaal
    unit_of_measurement: W
    accuracy_decimals: 1
    update_interval: 5s
    lambda: return id(fornuis_vermogen_a).state + id(fornuis_vermogen_b).state;
