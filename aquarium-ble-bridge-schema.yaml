# --- FOTOPERIODE SCHEMA ---
#
# Centrale tijdlijn waarop CO2 en WRGB2 zich afstemmen:
#   CO2 aan:   fotoperiode_start - co2_prestart (minuten)
#   CO2 uit:   fotoperiode_eind
#   WRGB2 aan: fotoperiode_start
#   WRGB2 uit: fotoperiode_eind
#
# Dit package verwijst naar geen enkel device: CO2 en WRGB2 haken zelf in op
# on_value via `!extend` (elk met eigen debounce), zodat beide optioneel zijn.
# Gespreide debounce (CO2 1.5s, WRGB2 4.5s) voorkomt gelijktijdige BLE-connects (HCI 0x07).

datetime:
  - platform: template
    id: fotoperiode_start
    name: "Fotoperiode start"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "14:00:00"
    icon: mdi:weather-sunset-up

  - platform: template
    id: fotoperiode_eind
    name: "Fotoperiode eind"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "21:00:00"
    icon: mdi:weather-sunset-down
