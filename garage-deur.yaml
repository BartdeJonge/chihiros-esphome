substitutions:
  device_name: garage-deur
  ha_name: Garage deur
  
esphome:
  name: '${device_name}'
esp8266:
  board: esp8285


wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  post_connect_roaming: false
  reboot_timeout: 0s

logger:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password
    
switch:
  - platform: gpio
    pin: GPIO4
    name: "Garage deur relay"
    id: relay
    internal: true

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO5
    filters:
      - invert:
      # Debounce the contact sensor to prevent rapid on/off/on events
      - delayed_on_off: 500ms
    name: Switch
    internal: true
    id: switchid
    
cover:
  - platform: template
    device_class: garage
    name: "Garage deur"
    id: template_cov
    open_action:
      - switch.turn_on: relay
      - delay: 0.5s
      - switch.turn_off: relay
    close_action:
      - switch.turn_on: relay
      - delay: 0.5s
      - switch.turn_off: relay
    lambda: |-
      if (id(switchid).state) {
        return COVER_CLOSED;
      } else {
        return COVER_OPEN;
      }
    