esphome:
  name: aquarium-ble-bridge
  friendly_name: aquarium-ble-bridge
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
wifi:
  ssid: !secret wifi_sid
  password: !secret wifi_password_iot
  power_save_mode: NONE
  reboot_timeout: 0s
logger:
  level: WARN
api:
  encryption:
    key: !secret encryption_key
safe_mode:
  num_attempts: 100
  boot_is_good_after: 30s
ota:
  - platform: esphome
    password: !secret ota_password
