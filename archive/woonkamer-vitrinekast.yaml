substitutions:
  device_name: woonkamer-vitrinekast

esphome:
  name: ${device_name}
  platform: ESP8266
  board: esp01_1m

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable

logger:

api:
  encryption:
    key: !secret encryption_key

ota:
  password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

i2c:
  sda: 4
  scl: 5
  scan: False

pca9685:
  - frequency: 500

output:
  - platform: pca9685
    id: shelf_1
    channel: 3
  - platform: pca9685
    id: shelf_2
    channel: 4
  - platform: pca9685
    id: shelf_3
    channel: 5
  - platform: pca9685
    id: shelf_4
    channel: 8
  - platform: pca9685
    id: shelf_5
    channel: 9
  - platform: pca9685
    id: lego
    channel: 12
    
light:
  - platform: monochromatic
    name: "Shelf 1"
    output: shelf_1
  - platform: monochromatic
    name: "Shelf 2"
    output: shelf_2
  - platform: monochromatic
    name: "Shelf 3"
    output: shelf_3
  - platform: monochromatic
    name: "Shelf 4"
    output: shelf_4
  - platform: monochromatic
    name: "Shelf 5"
    output: shelf_5
  - platform: monochromatic
    name: "Lego"
    output: lego