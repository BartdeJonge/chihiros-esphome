substitutions:
  device_name: woonkamer-lucht

esphome:
  name: '${device_name}'

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret encryption_key

ota:
  password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

uart:
  rx_pin: D2
  baud_rate: 9600

sensor:
  - platform: pm1006
    pm_2_5:
      name: '${device_name} Particulate Matter 2.5µm Concentration'
      filters:
        - median:
            window_size: 7
            send_every: 7
            send_first_at: 7