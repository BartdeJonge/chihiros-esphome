substitutions:
  device_name: aquarium-co2-gewicht

esphome:
  name: '${device_name}'

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable

logger:

api:
  encryption:
    key: !secret encryption_key

ota:
  password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

sensor:
  - platform: hx711
    name: CO2 gewicht
    dout_pin: D0
    clk_pin: D1
    gain: 128
    update_interval: 15s