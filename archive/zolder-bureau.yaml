substitutions:
  device_name: zolder-bureau
  # Kalibreer current_res en voltage_div met een bekende load voor nauwkeurige metingen
  current_res: '0.00221'
  voltage_div: '871'

esphome:
  name: '${device_name}'
  friendly_name: Zolder bureau

esp8266:
  board: esp8285

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  post_connect_roaming: false
  reboot_timeout: 0s

logger:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

time:
  - platform: homeassistant

status_led:
  pin:
    number: GPIO2
    inverted: true

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      mode: INPUT_PULLUP
    name: Knop
    on_press:
      - switch.toggle: relay

switch:
  - platform: gpio
    pin: GPIO14
    restore_mode: RESTORE_DEFAULT_ON
    id: relay
    name: Schakelaar

sensor:
  - platform: hlw8012
    sel_pin:
      number: GPIO12
      inverted: true
    cf_pin: GPIO5
    cf1_pin: GPIO4
    current_resistor: ${current_res}
    voltage_divider: ${voltage_div}
    power:
      name: Vermogen
      id: watt
      unit_of_measurement: W
      icon: mdi:flash-outline
    current:
      name: Stroom
      unit_of_measurement: A
    voltage:
      name: Spanning
      unit_of_measurement: V
    change_mode_every: 4
    update_interval: 10s
  - platform: total_daily_energy
    name: Energie vandaag
    power_id: watt
    unit_of_measurement: kWh
    accuracy_decimals: 5
    filters:
      - multiply: 0.001
