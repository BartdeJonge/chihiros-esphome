# --- SAMENVATTING ---
# Chihiros magnetisch roerder BLE bridge (4 kanalen)
# - MAC: EC:DE:A6:A0:61:1D
# - Protocol: Chihiros Magic Commander, 0xa5 header voor roerder commands
# - Bij connect: auth → RTC → 4× enable+snelheid+timer → apply
# - Real-time aan/uit per kanaal via cmd 0x14 (CHANNEL_TOGGLE)
# - Snelheid + timer instelbaar via HA input_numbers

substitutions:
  name: aquarium-roerder
  friendly_name: aquarium-roerder

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: homeassistant
    id: ha_time

globals:
  - id: cmd_seq
    type: uint8_t
    restore_value: false
    initial_value: '1'

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 320ms
    window: 320ms
    continuous: true

ble_client:
  - mac_address: EC:DE:A6:A0:61:1D
    id: chihiros_roerder
    on_connect:
      then:
        - delay: 500ms
        # Auth
        - ble_client.ble_write:
            id: chihiros_roerder
            service_uuid: "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
            characteristic_uuid: "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
            value: !lambda |-
              uint8_t seq = id(cmd_seq)++;
              std::vector<uint8_t> frame = {0x01, 0x06, 0x00, seq, 0x04, 0x01};
              uint8_t crc = 0; for (auto b : frame) crc ^= b;
              std::vector<uint8_t> p = {0x5a}; p.insert(p.end(), frame.begin(), frame.end()); p.push_back(crc);
              return p;
        - delay: 200ms
        # RTC sync
        - ble_client.ble_write:
            id: chihiros_roerder
            service_uuid: "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
            characteristic_uuid: "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
            value: !lambda |-
              auto t = id(ha_time).now();
              uint8_t seq = id(cmd_seq)++;
              std::vector<uint8_t> frame = {0x01, 0x0b, 0x00, seq, 0x09,
                (uint8_t)(t.year - 2000), (uint8_t)t.month, (uint8_t)t.day_of_month,
                (uint8_t)t.hour, (uint8_t)t.minute, (uint8_t)t.second};
              uint8_t crc = 0; for (auto b : frame) crc ^= b;
              std::vector<uint8_t> p = {0x5a}; p.insert(p.end(), frame.begin(), frame.end()); p.push_back(crc);
              return p;
        - delay: 200ms
        - script.execute: stuur_kanaal_config
    on_disconnect:
      then:
        - logger.log: "Roerder verbinding verbroken — herverbinding volgt"

script:
  - id: stuur_kanaal_config
    then:
      # Kanaal 0
      - ble_client.ble_write:
          id: chihiros_roerder
          service_uuid: "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
          characteristic_uuid: "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
          value: !lambda |-
            uint8_t seq = id(cmd_seq)++;
            uint8_t spd = (uint8_t)(id(roerder_k0_snelheid).state * 127.0 / 100.0);
            std::vector<uint8_t> frame = {0x01, 0x08, 0x00, seq, 0x20, 0x00, 0x00, 0x01};
            uint8_t crc = 0; for (auto b : frame) crc ^= b;
            std::vector<uint8_t> p = {0xa5}; p.insert(p.end(), frame.begin(), frame.end()); p.push_back(crc);
            return p;
      - delay: 100ms
      - ble_client.ble_write:
          id: chihiros_roerder
          service_uuid: "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
          characteristic_uuid: "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
          value: !lambda |-
            uint8_t seq = id(cmd_seq)++;
            uint8_t spd = (uint8_t)(id(roerder_k0_snelheid).state * 127.0 / 100.0);
            std::vector<uint8_t> frame = {0x01, 0x0b, 0x00, seq, 0x1b, 0x00, spd, 0x01, 0x00, 0x00, 0x00};
            uint8_t crc = 0; for (auto b : frame) crc ^= b;
            std::vector<uint8_t> p = {0xa5}; p.insert(p.end(), frame.begin(), frame.end()); p.push_back(crc);
            ESP_LOGI("roerder", "K0 snelheid=%d", spd);
            return p;
      - delay: 100ms
      - ble_client.ble_write:
          id: chihiros_roerder
          service_uuid: "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
          characteristic_uuid: "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
          value: !lambda |-
            uint8_t seq = id(cmd_seq)++;
            uint8_t duur = (uint8_t)id(roerder_k0_duur).state;
            uint8_t interval = (uint8_t)id(roerder_k0_interval).state;
            std::vector<uint8_t> frame = {0x01, 0x0b, 0x00, seq, 0x15, 0x00, 0x00, duur, interval, 0x00, 0x00};
            uint8_t crc = 0; for (auto b : frame) crc ^= b;
            std::vector<uint8_t> p = {0xa5}; p.insert(p.end(), frame.begin(), frame.end()); p.push_back(crc);
            ESP_LOGI("roerder", "K0 duur=%dmin interval=%dmin", duur, interval);
            return p;
      - delay: 100ms
      # Kanaal 1
