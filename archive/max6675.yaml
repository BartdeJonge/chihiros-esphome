esphome:
  name: max6675
  friendly_name: max6675

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  
api:

logger:

ota:
  password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

spi:
  miso_pin: D6
  clk_pin: D5

sensor:
  - platform: max6675
    name: "Living Room Temperature"
    cs_pin: D8
    update_interval: 10s
    