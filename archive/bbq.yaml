esphome:
  name: bbq

esp32:
  board: mhetesp32devkit
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  post_connect_roaming: false
  reboot_timeout: 0s

logger:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

external_components:
  - source: github://bendikwa/esphome-igrill@v1.4

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

ble_client:
  - mac_address: "70:91:8F:1D:F2:3D"
    id: igrill_v2

sensor:
  - platform: igrill
    ble_client_id: igrill_v2
    update_interval: 30s
    battery_level:
      name: "Batterij"
      id: igrill_batterij
    temperature_probe1:
      name: "Koepel Temperatuur"
      id: bbq_koepel_temperatuur
    temperature_probe2:
      name: "Vlees P2"
      id: vlees_p2
    temperature_probe3:
      name: "Vlees P3"
      id: vlees_p3
    temperature_probe4:
      name: "Vlees P4"
      id: vlees_p4

binary_sensor:
  - platform: template
    name: "Verbindingsstatus"
    id: igrill_verbindingsstatus
    device_class: connectivity
    lambda: |-
      return id(igrill_v2).connected();



    