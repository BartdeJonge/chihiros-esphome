esphome:
  name: aanwezigheid-tv
  friendly_name: aanwezigheid-tv

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable

logger:

api:
  encryption:
    key: !secret encryption_key

ota:
  password: !secret ota_password
  platform: esphome

web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

i2c:
  scl: GPIO17
  sda: GPIO16
  scan: true

sensor:
  - platform: bh1750
    name: "BH1750"
    address: 0x23

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO32
      mode:
        input: true
        pulldown: true
    name: "PIR Sensor"
    device_class: motion
    filters:
      - delayed_off: 1000ms 
          
  - platform: gpio
    pin:
      number: GPIO23
      mode:
        input: true
        pullup: true
    name: "MMWave Sensor"
    device_class: motion

bluetooth_proxy: