substitutions:
  device_name: woonkamer-rgb-2

esphome:
  name: '${device_name}'

esp8266:
  board: d1_mini
  framework:
    version: 2.7.4

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret encryption_key

ota:
  password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password
      
light:
  - platform: fastled_clockless
    chipset: WS2812B
    pin: D4
    num_leds: 16
    rgb_order: GRB
    name: "RGB 2"
    
button:
  - platform: wake_on_lan
    name: "Start the Server"
    target_mac_address: b4:e6:2a:3a:d4:76