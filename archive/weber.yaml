substitutions:
  device_name: weber

esphome:
  name: '${device_name}'
  platform: ESP32
  board: mhetesp32devkit

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable

logger:
  
api:
  encryption:
    key: !secret encryption_key

ota:
  password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

external_components:
  - source: github://bendikwa/esphome-igrill@v1.0

esp32_ble_tracker:

igrill_ble_listener:

ble_client:
  - mac_address: 70:91:8F:1D:F2:3D
    id: igrill_device

sensor:
  - platform: igrill
    ble_client_id: igrill_device
    update_interval: 30s # default
    send_value_when_unplugged: true # default
    unplugged_probe_value: 0 # default
    battery_level:
      name: "IGrill battery"
    temperature_probe1:
      name: "IGrill temp 1"
      unit_of_measurement: "°C" # default
    temperature_probe2:
      name: "IGrill temp 2"
      unit_of_measurement: "°C" # default
    temperature_probe3:
      name: "IGrill temp 3"
      unit_of_measurement: "°C" # default
    temperature_probe4:
      name: "IGrill temp 4"
      unit_of_measurement: "°C" # default