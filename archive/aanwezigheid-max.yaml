esphome:
  name: aanwezigheid-max
  friendly_name: aanwezigheid-max

esp32:
  board: mhetesp32devkit
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable

logger:

api:
  encryption:
    key: !secret encryption_key

ota:
  password: !secret ota_password
  platform: esphome

web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

#bluetooth_proxy:

sensor:
- platform: pulse_counter
  pin: GPIO25
  name: Pressure
  id: bed_sensor
  update_interval: 0.5s
  unit_of_measurement: '%'
  icon: mdi:gauge
  filters:
    #- lambda: |-                                # scale pulses/minute to 0%->100%
    #    float cal_0 = id(full_range).state ? 0 : ${calibrate_0};

    #    float val = (x - cal_0) * 100;
    #    float range = ${calibrate_100} - cal_0;

    #    return val/range;
    - clamp:
        min_value: 0
    - sliding_window_moving_average:
        window_size: 5
        send_every: 1
    - or:
        - delta: 1.0
        - throttle: 180s   # but still update every `reporting_interval_max`
  