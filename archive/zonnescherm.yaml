substitutions:
  device_name: zonnescherm
  ha_name: Zonnescherm
  
esphome:
  name: '${device_name}'

esp8266:
  board: esp01_1m
  restore_from_flash: true

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret encryption_key

ota:
  password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password
    
i2c:
  sda: GPIO12
  scl: GPIO14

sensor:
  - platform: ade7953_i2c
    irq_pin: GPIO16
    voltage:
      name: ${device_name} Voltage
      internal: true
      filters:
        - throttle: 5s
    current_a:
      name: ${device_name} Open Current
      id: open_current
      internal: true
    current_b:
      internal: true
      name: ${device_name} Close Current
      id: close_current
    update_interval: 0.5s

  # NTC Temperature
  - platform: ntc
    sensor: temp_resistance_reading
    name: ${device_name} Temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K
    on_value_range:
      above: 90
      then: # Security shutdown by overheating
        - switch.turn_on: _shutdown

  - platform: resistance
    id: temp_resistance_reading
    sensor: temp_analog_reading
    configuration: DOWNSTREAM
    resistor: 32kOhm
    internal: true
  - platform: adc
    id: temp_analog_reading
    pin: A0
    update_interval: 30s
    internal: true

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
    name: ${device_name} Open Button
    on_press:
      then:
        cover.open: blind

  - platform: gpio
    pin:
      number: GPIO05
    name: ${device_name} Close Button
    on_press:
      then:
        cover.close: blind

  - platform: gpio
    pin: GPIO16
    name: "ade7953 IRQ pin"
    internal: true

switch:
  - platform: shutdown
    id: _shutdown
    name: ${device_name} Shutdown
    internal: true
    
  - platform: gpio
    id: open_relay
    name: ${device_name} Open Relay
    pin: GPIO15
    restore_mode: RESTORE_DEFAULT_OFF
    interlock: &interlock [open_relay, close_relay]
    interlock_wait_time: 200ms

  - platform: gpio
    id: close_relay
    name: ${device_name} Close Relay
    pin: GPIO4
    restore_mode: RESTORE_DEFAULT_OFF
    interlock: *interlock
    interlock_wait_time: 200ms

# Example configuration entry
cover:
  - platform: current_based
    name: ${device_name} Blind
    id: blind

    open_sensor: open_current
    open_moving_current_threshold: 0.5
    open_duration: 34s
    open_action:
      - switch.turn_on: open_relay
    close_sensor: close_current
    close_moving_current_threshold: 0.5
    close_duration: 34s
    close_action:
      - switch.turn_on: close_relay
    stop_action:
      - switch.turn_off: close_relay
      - switch.turn_off: open_relay
    obstacle_rollback: 30%
    start_sensing_delay: 0.8s
    malfunction_detection: true
    malfunction_action:
      then:
        - logger.log: "Malfunction detected. Relay welded."

status_led:
  pin:
    number: GPIO0
    inverted: yes