substitutions:
  device_name: warm-water

esphome:
  name: '${device_name}'
  platform: ESP32
  board: nodemcu-32s

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret encryption_key

ota:
  password: !secret ota_password
  
time:
  - platform: homeassistant
    id: homeassistant_time  
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password
    
sensor:
  - platform: pulse_meter
    id: sensor_pulse_meter_warm
    pin: 34
    name: "Warm water L/min"
    icon: "mdi:water"
    unit_of_measurement: 'L/min'
    accuracy_decimals: 1
    total:
      name: "Warm water total"
      unit_of_measurement: "m³"
      state_class: total_increasing
      device_class: water
      accuracy_decimals: 3
      filters:
        - multiply: 0.001