substitutions:
  device_name: airgradient

esphome:
  name: '${device_name}'
  platform: ESP8266
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable

logger:
  baud_rate: 0
  
api:
  encryption:
    key: !secret encryption_key

ota:
  password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

i2c:
  sda: D2
  scl: D1
  frequency: 400kHz
  
uart:
  - rx_pin: D5
    tx_pin: D6
    baud_rate: 9600
    id: uarta
  
  - rx_pin: D4
    tx_pin: D3
    baud_rate: 9600
    id: uartb

font:
  - file: "font/monofont.ttf"
    id: opensans
    size: 10

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 64x48"
    pages:
      - id: page1
        lambda: |-
          it.printf(0, 0, id(opensans), "CO2: %.0fppm", id(co2).state);
          it.printf(0, 10, id(opensans), "PM25: %.0f", id(pm25).state);
          it.printf(0, 20, id(opensans), "Hmdty: %.0f", id(humidity).state);
          it.printf(0, 30, id(opensans), "Temp: %.0fC", id(temp).state);

interval:
  - interval: 5s
    then:
      - display.page.show_next: oled
      - component.update: oled

sensor:
  - platform: bme280
    temperature:
      name: "${device_name} Temperature"
      id: temp
      oversampling: 16x
    pressure:
      name: "${device_name} Pressure"
    humidity:
      name: "${device_name} Humidity"
      id: humidity
    address: 0x76
    update_interval: 30s

  - platform: pmsx003
    type: PMSX003
    uart_id: uarta
    pm_1_0:
      id: pm10
      name: "${device_name} Particulate Matter <1.0µm Concentration"
      filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
    pm_2_5:
      id: pm25
      name: "${device_name} Particulate Matter <2.5µm Concentration"
      filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
    pm_10_0:
      id: pm100
      name: "${device_name} Particulate Matter <10.0µm Concentration"  
      filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
    update_interval: 30s

  - platform: senseair
    uart_id: uartb
    co2:
      id: co2
      name: "${device_name} CO2"
      filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
    update_interval: 30s