substitutions:
  device_name: hal-deurbel

esphome:
  name: '${device_name}'

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  post_connect_roaming: false
  reboot_timeout: 0s
  
logger:
  baud_rate: 0

ota:
  - platform: esphome
    password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password
    
uart:
  baud_rate: 9600
  tx_pin: GPIO17
  rx_pin: GPIO16

dfplayer:
  on_finished_playback:
    then:
      - switch.turn_off: relay
      - dfplayer.reset

api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key
  services:
  - service: ding_dong
    variables:
      volume: int
    then:
      - dfplayer.set_volume: !lambda 'return volume;'
      - switch.turn_on: relay
      - delay: 100ms
      - dfplayer.play: 1
  
switch:
- platform: gpio
  name: "Relay"
  pin: GPIO18
  id: relay