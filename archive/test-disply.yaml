globals:
  - id: display_switch
    type: boolean
    restore_value: true
    initial_value: "true"

substitutions:
  device_name: test-disply
  
esphome:
  name: '${device_name}'

esp32:
  board: wemos_d1_mini32

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable

logger:

api:

ota:
  password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 20

  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: font2
    size: 16

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

color:
  - id: my_red
    red: 100%
    green: 3%
    blue: 5%

switch:
  - platform: template
    id: display_on_off
    name: "Display On Off"
    lambda: return id(display_switch);
    turn_on_action:
      - lambda: |-
          id(display_switch) = true;
          id(my_display).turn_off();;
    turn_off_action:
      - lambda: |-
          id(display_switch) = false;
          id(my_display).turn_on();

display:
  - platform: ssd1351_spi
    id: my_display
    model: "SSD1351 128x128"
    reset_pin: GPIO17
    cs_pin: GPIO05
    dc_pin: GPIO16
    lambda: |-
      it.rectangle(0,  0, it.get_width(), it.get_height(), id(my_red));
      it.print(10, 10, id(roboto), "Hello World!");