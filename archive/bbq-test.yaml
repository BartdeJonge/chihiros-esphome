substitutions:
  device_name: bbq-controller

esphome:
  name: ${device_name}
  friendly_name: BBQ Controller

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  reboot_timeout: 0s

logger:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

output:
  - platform: ledc
    pin: GPIO27
    id: blower_pwm_raw
    frequency: 200Hz
    inverted: true

  - platform: template
    id: blower_pwm
    type: float
    write_action:
      - if:
          condition:
            lambda: 'return state > 0.0f;'
          then:
            - output.set_level:
                id: blower_pwm_raw
                level: !lambda 'return state < 0.2f ? 0.2f : state;'
          else:
            - output.set_level:
                id: blower_pwm_raw
                level: 0.0

fan:
  - platform: speed
    output: blower_pwm
    name: "BBQ Fan"
    id: bbq_fan
    speed_count: 100
