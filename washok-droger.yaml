substitutions:
  device_name: washok-droger
  current_res: '0.00248'
  voltage_div: '755'
  max_power: '3450'
  cf1_pin: GPIO4

esphome:
  name: '${device_name}'
  on_boot:
    then:
      - switch.turn_on: relay
      - output.turn_on: led

esp8266:
  board: esp8285
  
wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  post_connect_roaming: false
  reboot_timeout: 0s

logger:
  
api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password
    
time:
  - platform: homeassistant
    id: homeassistant_time

binary_sensor:
  - platform: gpio
    name: 'Button'
    id: button
    pin:
      number: GPIO13
      inverted: true
    on_press:
      then:
        - switch.toggle: relay

output:
  - platform: gpio
    pin: GPIO0
    inverted: true
    id: led

switch:
  - platform: gpio
    pin: GPIO15
    restore_mode: RESTORE_DEFAULT_ON
    id: relay
    name: 'Relay'
    on_turn_on:
      - output.turn_on: led
    on_turn_off:
      - output.turn_off: led

status_led:
  pin:
    number: GPIO2
    inverted: true

sensor:
  - platform: hlw8012
    sel_pin:
      number: GPIO12
      inverted: true
    cf_pin: GPIO5
    cf1_pin: ${cf1_pin}
    current_resistor: ${current_res}
    voltage_divider: ${voltage_div}
    power:
      name: 'Power'
      unit_of_measurement: 'W'
      id: power
      icon: mdi:flash-outline
    change_mode_every: 4
    update_interval: 10s
  
  - platform: total_daily_energy
    name: 'Daily Energy'
    power_id: power
    unit_of_measurement: 'kWh'
    accuracy_decimals: 5
    filters:
      - multiply: 0.001

  - platform: integration
    name: 'Total Energy'
    sensor: power
    time_unit: h
    restore: true
    state_class: total_increasing
    device_class: energy
    filters:
      - multiply: 0.001
    unit_of_measurement: 'kWh'