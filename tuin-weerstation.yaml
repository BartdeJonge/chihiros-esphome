substitutions:
  device_name: tuin-weerstation

esphome:
  name: '${device_name}'
  friendly_name: '${device_name}'

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  post_connect_roaming: false
  reboot_timeout: 0s

logger:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

captive_portal:

status_led:
  pin: GPIO23

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - sensor.integration.reset: rain_per_day
      - seconds: 0
        minutes: 0
        hours: /1
        then:
          - sensor.integration.reset: rain_per_hour
      - seconds: 0
        minutes: /1
        then:
          - sensor.integration.reset: rain_per_min

#i2c:
#  scan: true

sensor:
- platform: pulse_counter
  pin:
    number: GPIO32
    mode: INPUT
  name: 'wind speed raw'
  icon: 'mdi:weather-windy'
  id: wind_speed_raw
  count_mode:
    rising_edge: INCREMENT
    falling_edge: DISABLE
  internal_filter: 13us
  #rotations_per_sec = pulses/2/60
  #circ_m=0.09*2*3.14 = 0.5652
  #mps = 1.18*circ_m*rotations_per_sec  
  #mps = 1.18*0.5652/2/60 = 0,0055578
  #filters:
  #  # - multiply: 0.0055578 #use for m/s
  #  # - multiply: 2.237 #m/s to mph
  #  - sliding_window_moving_average:
  #      window_size: 4
  #      send_every: 1
  #  - multiply: 0.0055578

- platform: copy
  name: 'wind speed'
  id: wind_speed
  source_id: wind_speed_raw
  unit_of_measurement: 'm/s'
  icon: 'mdi:weather-windy'
  filters:
    - multiply: 0.0055578 

- platform: copy
  name: 'wind speed (km/h)'
  id: wind_speed_kmh
  source_id: wind_speed
  unit_of_measurement: 'km/h'
  icon: 'mdi:weather-windy'
  filters:
    - multiply: 3.6

- platform: adc
  id: source_sensor
  pin: GPIO33
  name: ADC
  attenuation: 11db
  internal: true
  update_interval: 10s
  accuracy_decimals: 1

- platform: resistance
  sensor: source_sensor
  id: resistance_sensor
  configuration: DOWNSTREAM
  resistor: 10kOhm
  internal: true
  name: Resistance Sensor
  reference_voltage: 3.3V
  accuracy_decimals: 1
  filters:
    - median:
        window_size: 7
        send_every: 4
        send_first_at: 3
  on_value:
    - if:
        condition:
          sensor.in_range:
            id: resistance_sensor
            above: 35000
            below: 37500
        then:
          - text_sensor.template.publish:
              id: wind_dir_card
              state: "S"
          - sensor.template.publish:
              id: wind_heading
              state: 180
    - if:
        condition:
          sensor.in_range:
            id: resistance_sensor
            above: 8500
            below: 9000
        then:
          - text_sensor.template.publish:
              id: wind_dir_card
              state: "SE"
          - sensor.template.publish:
              id: wind_heading
              state: 135.0
    - if:
        condition:
          sensor.in_range:
            id: resistance_sensor
            above: 1000
            below: 1250
        then:
          - text_sensor.template.publish:
              id: wind_dir_card
              state: "E"
          - sensor.template.publish:
              id: wind_heading
              state: 90.0
    - if:
        condition:
          sensor.in_range:
            id: resistance_sensor
            above: 2200
            below: 2500
        then:
          - text_sensor.template.publish:
              id: wind_dir_card
              state: "NE"
          - sensor.template.publish:
              id: wind_heading
              state: 45.0
    - if:
        condition:
          sensor.in_range:
            id: resistance_sensor
            above: 4000
            below: 4400
        then:
          - text_sensor.template.publish:
              id: wind_dir_card
              state: "N"
          - sensor.template.publish:
              id: wind_heading
              state: 0.0
    - if:
        condition:
          sensor.in_range:
            id: resistance_sensor
            above: 17000
            below: 18000
        then:
          - text_sensor.template.publish:
              id: wind_dir_card
              state: "NW"
          - sensor.template.publish:
              id: wind_heading
              state: 315.0
    - if:
        condition:
          sensor.in_range:
            id: resistance_sensor
            above: 130000
            below: 140000
        then:
          - text_sensor.template.publish:
              id: wind_dir_card
              state: "W"
          - sensor.template.publish:
              id: wind_heading
              state: 270.0
    - if:
        condition:
          sensor.in_range:
            id: resistance_sensor
            above: 68000
            below: 73000
        then:
          - text_sensor.template.publish:
              id: wind_dir_card
              state: "SW"
          - sensor.template.publish:
              id: wind_heading
              state: 225.0

- platform: pulse_counter
  pin:
    number: GPIO35
  unit_of_measurement: 'mm'
  name: "rain gauge"
  icon: 'mdi:weather-rainy'
  id: rain_gauge
  internal: true
  count_mode:
    rising_edge: DISABLE
    falling_edge: INCREMENT
  internal_filter: 13us
  update_interval: 60s
  filters:
    # Each 0.011" (0.2794mm) of rain causes one momentary contact closure
    - multiply: 0.2794
  accuracy_decimals: 4

- platform: integration
  name: "rainfall per min"
  id: rain_per_min
  time_unit: min
  unit_of_measurement: 'mm'
  icon: 'mdi:weather-rainy'
  sensor: rain_gauge

- platform: integration
  name: "rainfall per hour"
  id: rain_per_hour
  time_unit: h
  unit_of_measurement: 'mm'
  icon: 'mdi:weather-rainy'
  sensor: rain_gauge

- platform: integration
  name: "rainfall per day"
  id: rain_per_day
  time_unit: d
  unit_of_measurement: 'mm'
  icon: 'mdi:weather-rainy'
  sensor: rain_gauge

- platform: total_daily_energy
  name: "total daily rain"
  power_id: rain_gauge
  unit_of_measurement: 'mm'
  icon: 'mdi:weather-rainy'
  state_class: total_increasing
  device_class: precipitation
  # x60 To convert to aggregated rain amount
  filters:
    - multiply: 60

- platform: template
  name: "wind heading"
  id: wind_heading
  unit_of_measurement: "°"
             
text_sensor:
- platform: template
  name: "wind cardinal direction"
  id: wind_dir_card