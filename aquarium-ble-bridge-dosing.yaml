# --- DOSING PUMP ---
#
# Protocol afgeleid uit btsnoop HCI logs (2026-06-08):
#
# Connect:      auth(BASE,0x01) → RTC → RTC → auth_dose1(DEVICE,0x04) → auth_dose2(DEVICE,0x05)
# Schema:       STIR_ENABLE + STIR_SPEED + STIR_TIMER per pomp (zie helpers in chihiros_ble.h)
# Handmatig:    STIR_SPEED [pump_idx, 0x00, 0x00, 0x00, vol_01ml]
#
# Tijdcodering: uur gesplitst over STIR_TIMER[2]=uur>>1 en STIR_SPEED[2]=uur&1 (alle uren 0-23)
# Weekdays:     zelfde bitmask als WRGB2 — Ma=64 Di=32 Wo=16 Do=8 Vr=4 Za=2 Zo=1
# Disable:      STIR_ENABLE met enable=false (0x00)
#
# Per-pomp entities staan in aquarium-ble-bridge-dosing-pomp.yaml
# (parameterized package, 4× ingevoegd hieronder).

packages:
  pomp1: !include
    file: aquarium-ble-bridge-dosing-pomp.yaml
    vars:
      pomp: "1"
      idx: "0"
      vol_init: "1.0"
      uur_init: "9"
      weekdays_init: "127"
      schema_restore: "RESTORE_DEFAULT_ON"
  pomp2: !include
    file: aquarium-ble-bridge-dosing-pomp.yaml
    vars:
      pomp: "2"
      idx: "1"
      vol_init: "10.0"
      uur_init: "17"
      weekdays_init: "88"
      schema_restore: "RESTORE_DEFAULT_OFF"
  pomp3: !include
    file: aquarium-ble-bridge-dosing-pomp.yaml
    vars:
      pomp: "3"
      idx: "2"
      vol_init: "1.0"
      uur_init: "9"
      weekdays_init: "127"
      schema_restore: "RESTORE_DEFAULT_OFF"
  pomp4: !include
    file: aquarium-ble-bridge-dosing-pomp.yaml
    vars:
      pomp: "4"
      idx: "3"
      vol_init: "1.0"
      uur_init: "9"
      weekdays_init: "127"
      schema_restore: "RESTORE_DEFAULT_OFF"

globals:
  - id: dosing_device
    type: chihiros::DosingDevice
    restore_value: false

  # Epoch van de laatst afgeronde config-drain (zie CO2 voor toelichting)
  - id: dosing_laatste_sync_ts
    type: float
    restore_value: true
    initial_value: '0'

ble_client:
  - mac_address: ${dosing_mac}
    id: chihiros_dosing
    on_connect:
      then:
        - delay: 500ms
        - lambda: |-
            bool    actief[]   = {id(sw_dosing_schema_p1).state, id(sw_dosing_schema_p2).state,
                                  id(sw_dosing_schema_p3).state, id(sw_dosing_schema_p4).state};
            uint8_t weekdays[] = {(uint8_t)id(num_dosing_weekdays_p1).state, (uint8_t)id(num_dosing_weekdays_p2).state,
                                  (uint8_t)id(num_dosing_weekdays_p3).state, (uint8_t)id(num_dosing_weekdays_p4).state};
            uint8_t uur[]      = {(uint8_t)id(num_dosing_hour_p1).state, (uint8_t)id(num_dosing_hour_p2).state,
                                  (uint8_t)id(num_dosing_hour_p3).state, (uint8_t)id(num_dosing_hour_p4).state};
            uint8_t min_[]     = {(uint8_t)id(num_dosing_min_p1).state, (uint8_t)id(num_dosing_min_p2).state,
                                  (uint8_t)id(num_dosing_min_p3).state, (uint8_t)id(num_dosing_min_p4).state};
            float   vol[]      = {id(num_dosing_vol_p1).state, id(num_dosing_vol_p2).state,
                                  id(num_dosing_vol_p3).state, id(num_dosing_vol_p4).state};
            id(dosing_device).prepare(
              id(ntp_tijd).now(), actief, weekdays, uur, min_, vol
            );
        - while:
            condition:
              lambda: return id(dosing_device).has_next();
            then:
              - ble_client.ble_write:
                  id: chihiros_dosing
                  service_uuid: ${ble_service}
                  characteristic_uuid: ${ble_tx}
                  value: !lambda return id(dosing_device).next();
              - delay: 200ms
        - lambda: |-
            if (id(ntp_tijd).now().is_valid()) {
              id(dosing_laatste_sync_ts) = id(ntp_tijd).now().timestamp;
              id(dosing_laatste_sync).publish_state(id(dosing_laatste_sync_ts));
            }
        - switch.turn_off: dosing_verbinding
        - logger.log: "dosing: klaar"
    on_disconnect:
      then:
        - logger.log: "dosing: verbinding verbroken"

script:
  - id: dosing_verbind_als_klaar
    then:
      - if:
          condition:
            lambda: return id(ha_verbonden);
          then:
            - switch.turn_on: dosing_verbinding

  - id: dosing_debounce
    mode: restart
    then:
      - delay: 1500ms
      - script.execute: dosing_verbind_als_klaar


switch:
  - platform: ble_client
    ble_client_id: chihiros_dosing
    id: dosing_verbinding
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF

button:
  - platform: template
    name: "Dosing RTC sync"
    id: btn_dosing_rtc_sync
    icon: mdi:clock-sync
    on_press:
      # Vlag alleen zetten als er echt verbonden wordt (zie CO2 RTC sync)
      - if:
          condition:
            lambda: return id(ha_verbonden);
          then:
            - lambda: id(dosing_device).set_rtc_only();
            - script.execute: dosing_verbind_als_klaar

sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: chihiros_dosing
    service_uuid: ${ble_service}
    characteristic_uuid: ${ble_rx}
    id: dosing_notificatie
    name: "Dosing Notificatie"
    notify: true
    internal: true
    unit_of_measurement: ""
    lambda: |-
      ESP_LOGI("dosing", "Notificatie (%d bytes): %s", (int)x.size(), chihiros::hex_dump(x).c_str());
      return NAN;

  - platform: template
    id: dosing_laatste_sync
    name: "Dosing laatste sync"
    device_class: timestamp
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 300s
    lambda: |-
      if (id(dosing_laatste_sync_ts) > 0) return id(dosing_laatste_sync_ts);
      return NAN;
