# --- DOSING POMP (parameterized package) ---
#
# Wordt 4× ingevoegd vanuit aquarium-ble-bridge-dosing.yaml met vars:
#   pomp           — pompnummer 1-4 (entity-namen)
#   idx            — 0-based pomp-index 0-3 (protocol)
#   vol_init       — standaard volume in mL (alleen relevant bij eerste boot)
#   uur_init       — standaard schema-uur
#   weekdays_init  — standaard weekdays-bitmask (Ma=64 Di=32 Wo=16 Do=8 Vr=4 Za=2 Zo=1)
#   schema_restore — restore_mode van de schema-switch
#
# Entity-namen en -id's zijn identiek aan de oude losse blokken — HA merkt niets van
# deze refactor.

switch:
  - platform: template
    name: "Dosing schema pomp ${pomp}"
    id: sw_dosing_schema_p${pomp}
    icon: mdi:calendar-clock
    restore_mode: ${schema_restore}
    optimistic: true
    on_turn_on:
      - script.execute: dosing_verbind_als_klaar
    on_turn_off:
      - script.execute: dosing_verbind_als_klaar

button:
  # Dose-vlag alleen zetten als er echt verbonden wordt — een blijven-hangen vlag
  # zou bij een latere schema-connect alsnog een onverwachte dosering afleveren
  - platform: template
    name: "Dosing pomp ${pomp}"
    id: btn_dosing_p${pomp}
    icon: mdi:eyedropper
    on_press:
      - if:
          condition:
            lambda: return id(ha_verbonden);
          then:
            - lambda: id(dosing_device).set_manual_dose(${idx}, (uint8_t)(id(num_dosing_vol_p${pomp}).state * 10.0f + 0.5f));
            - script.execute: dosing_verbind_als_klaar

number:
  # Volume (handmatige dosis + schema)
  - platform: template
    name: "Dosing pomp ${pomp} volume"
    id: num_dosing_vol_p${pomp}
    min_value: 0.5
    max_value: 25.5
    step: 0.5
    initial_value: ${vol_init}
    restore_value: true
    unit_of_measurement: "mL"
    optimistic: true
    icon: mdi:water
    on_value:
      - script.execute: dosing_debounce

  # Tijdstip schema
  - platform: template
    name: "Dosing schema pomp ${pomp} uur"
    id: num_dosing_hour_p${pomp}
    min_value: 0
    max_value: 23
    step: 1
    initial_value: ${uur_init}
    restore_value: true
    unit_of_measurement: "u"
    optimistic: true
    icon: mdi:clock-outline
    on_value:
      - script.execute: dosing_debounce

  - platform: template
    name: "Dosing schema pomp ${pomp} min"
    id: num_dosing_min_p${pomp}
    min_value: 0
    max_value: 59
    step: 1
    initial_value: 0
    restore_value: true
    unit_of_measurement: "min"
    optimistic: true
    icon: mdi:clock-outline
    on_value:
      - script.execute: dosing_debounce

  # Weekdays bitmask
  - platform: template
    name: "Dosing schema pomp ${pomp} weekdays"
    id: num_dosing_weekdays_p${pomp}
    min_value: 0
    max_value: 127
    step: 1
    initial_value: ${weekdays_init}
    restore_value: true
    optimistic: true
    icon: mdi:calendar-week
    on_value:
      - script.execute: dosing_debounce
