globals:
 - id: R
   type: float
   restore_value: true
   initial_value: '1.0'
 - id: G
   type: float
   restore_value: true
   initial_value: '0.0'
 - id: B
   type: float
   restore_value: true
   initial_value: '0.0'
   
substitutions:
  device_name: max-potlood

esphome:
  name: '${device_name}'
esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  post_connect_roaming: false
  reboot_timeout: 0s

logger:
  baud_rate: 0

api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key
  services:
    - service: kleur_max_potlood
      variables:
        Rv: float
        Gv: float
        Bv: float
      then:
        - globals.set:
            id: R
            value: !lambda 'return Rv;'
        - globals.set:
            id: G
            value: !lambda 'return Gv;'
        - globals.set:
            id: B
            value: !lambda 'return Bv;'                
        - light.turn_on: 
            id: potlood
            red: !lambda |-
              return id(R);
            green: !lambda |-
              return id(G);
            blue: !lambda |-
              return id(B);
    
ota:
  - platform: esphome
    password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password
    
output:
  - platform: ledc
    pin: GPIO27
    id: blue
  - platform: ledc
    pin: GPIO25
    id: green
  - platform: ledc
    pin: GPIO32
    id: red


light:
  - platform: rgb
    name: "Potlood"
    id: potlood
    red: red
    green: green
    blue: blue
    
binary_sensor:
  - platform: gpio
    pin: 
      number: 22
      mode:
        input: true
        pullup: true
    name: "Potlood knop"
    on_press:
      then:
        - logger.log:
            format: "R %.2f G %.2f B %.2f"
            args: [ 'id(R)', 'id(G)', 'id(B)' ]
        - lambda: |-            
            if (id(R) == 1.0 && id(G) == 1.0 && id(B) == 0.0) {
              // ROOD
              id(R) = 1;  id(G) = 0; id(B) = 0;
            } 
            else if (id(R) == 1.0 && id(G) == 0.0 && id(B) == 0.0)  {
              // BLAUW
              id(R) = 0;  id(G) = 0; id(B) = 1;
            }
            else if (id(R) == 0.0 && id(G) == 0.0 && id(B) == 1.0)  {
              // PAARS
              id(R) = 1;  id(G) = 0; id(B) = 1;
            }
            else if (id(R) == 1.0 && id(G) == 0.0 && id(B) == 1.0)  {
              // ORANJE
              id(R) = 1;  id(G) = 0.5; id(B) = 0;
            }
            else if (id(R) == 1.0 && id(G) > 0.4 && id(G) < 0.6 && id(B) == 0.0)  {
              // ROZE
              id(R) = 1;  id(G) = 0.5; id(B) = 0.5;
            }
            else if (id(R) == 1.0 && id(G) > 0.4 && id(G) < 0.6 && id(B) > 0.4 && id(B) < 0.6)  {
              // LICHTBLAUW
              id(R) = 0;  id(G) = 1; id(B) = 1;
            }
            else if (id(R) == 0.0 && id(G) == 1.0 && id(B) == 1.0)  {
              // GEEL
              id(R) = 1;  id(G) = 1; id(B) = 0;
            }            
        - light.turn_on: 
            id: potlood
            red: !lambda |-
              return id(R);
            green: !lambda |-
              return id(G);
            blue: !lambda |-
              return id(B);
            
    on_double_click:
      then:
        - light.turn_off: potlood
      
    