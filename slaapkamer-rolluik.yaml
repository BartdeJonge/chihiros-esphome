substitutions:
  device_name: slaapkamer
  ha_name: Slaapkamer rolluik
  # GPIO verschilt per PCB versie — controleer versienummer op de PCB
  # v0.1.5: button=GPIO27, sw1=GPIO2, sw2=GPIO18, irq=GPIO36, temp=GPIO37, sda=GPIO33, scl=GPIO25
  # v0.1.9: button=GPIO4,  sw1=GPIO5, sw2=GPIO18, irq=GPIO27, temp=GPIO35, sda=GPIO26, scl=GPIO25
  button_pin:  GPIO4   # v0.1.9 — v0.1.5: GPIO27
  sw1_pin:     GPIO5   # v0.1.9 — v0.1.5: GPIO2
  sw2_pin:     GPIO18
  irq_pin:     GPIO27  # v0.1.9 — v0.1.5: GPIO36
  temp_pin:    GPIO35  # v0.1.9 — v0.1.5: GPIO37
  i2c_sda:     GPIO26  # v0.1.9 — v0.1.5: GPIO33
  i2c_scl:     GPIO25

esphome:
  name: '${device_name}'

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

safe_mode:
  disabled: true

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  reboot_timeout: 0s

logger:
  baud_rate: 0

globals:
  - id: offline_teller
    type: int
    restore_value: false
    initial_value: '0'
  - id: ha_ooit_verbonden
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: gepland_herstart
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: raam_open
    type: bool
    restore_value: false
    initial_value: 'true'

api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key
  on_client_connected:
    - globals.set:
        id: ha_ooit_verbonden
        value: 'true'
    - globals.set:
        id: offline_teller
        value: '0'
    - globals.set:
        id: gepland_herstart
        value: 'false'
interval:
  - interval: 30s
    then:
      - if:
          condition:
            and:
              - lambda: return id(ha_ooit_verbonden);
              - lambda: return id(gepland_herstart);
              - not:
                  api.connected:
          then:
            - globals.set:
                id: offline_teller
                value: !lambda return id(offline_teller) + 1;
            - if:
                condition:
                  lambda: return id(offline_teller) >= 10;
                then:
                  - cover.open: rolluik
                  - globals.set:
                      id: offline_teller
                      value: '0'

ota:
  - platform: esphome
    password: !secret ota_password

i2c:
  sda: ${i2c_sda}
  scl: ${i2c_scl}

sensor:
  - platform: ade7953_i2c
    irq_pin: ${irq_pin}
    voltage:
      name: Spanning
      internal: true
      filters:
        - throttle: 5s
    current_a:
      name: Stroom open
      id: stroom_open
      filters:
        - throttle: 1s
    current_b:
      name: Stroom sluit
      id: stroom_sluit
      filters:
        - throttle: 1s
    active_power_a:
      name: Vermogen open
      filters:
        - throttle: 5s
    active_power_b:
      name: Vermogen sluit
      filters:
        - throttle: 5s
    update_interval: 1s

  - platform: ntc
    sensor: temp_resistance
    name: Temperatuur
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K
    on_value_range:
      above: 90
      then:
        - switch.turn_off: open_relay
        - switch.turn_off: sluit_relay

  - platform: resistance
    id: temp_resistance
    sensor: temp_adc
    configuration: DOWNSTREAM
    resistor: 10kOhm
    internal: true

  - platform: adc
    id: temp_adc
    pin: ${temp_pin}
    attenuation: 12db
    update_interval: 30s
    internal: true

binary_sensor:
  - platform: status
    name: Status

  - platform: gpio
    pin:
      number: ${sw1_pin}
      mode: INPUT_PULLUP
      inverted: true
    name: Knop open
    on_press:
      then:
        - cover.open: rolluik

  - platform: gpio
    pin:
      number: ${sw2_pin}
      mode: INPUT_PULLUP
      inverted: true
    name: Knop sluit
    on_press:
      then:
        - if:
            condition:
              lambda: return !id(raam_open);
            then:
              - cover.close: rolluik

switch:
  - platform: gpio
    id: open_relay
    name: Relay open
    pin: GPIO12
    restore_mode: RESTORE_DEFAULT_OFF
    interlock: &interlock [open_relay, sluit_relay]
    interlock_wait_time: 200ms
    internal: true

  - platform: gpio
    id: sluit_relay
    name: Relay sluit
    pin: GPIO13
    restore_mode: RESTORE_DEFAULT_OFF
    interlock: *interlock
    interlock_wait_time: 200ms
    internal: true

  - platform: template
    name: Gepland herstart
    id: gepland_herstart_switch
    lambda: return id(gepland_herstart);
    turn_on_action:
      - globals.set:
          id: gepland_herstart
          value: 'true'
    turn_off_action:
      - globals.set:
          id: gepland_herstart
          value: 'false'

  - platform: template
    name: Raam open
    id: raam_open_switch
    lambda: return id(raam_open);
    turn_on_action:
      - globals.set:
          id: raam_open
          value: 'true'
    turn_off_action:
      - globals.set:
          id: raam_open
          value: 'false'
      - if:
          condition:
            lambda: return id(rolluik).current_operation == esphome::cover::COVER_OPERATION_CLOSING;
          then:
            - cover.stop: rolluik

cover:
  - platform: current_based
    name: Rolluik
    id: rolluik
    device_class: shutter
    open_sensor: stroom_sluit
    open_moving_current_threshold: 0.3
    open_duration: 20s
    close_sensor: stroom_open
    close_moving_current_threshold: 0.3
    close_duration: 17s
    max_duration: 25s
    start_sensing_delay: 1s
    open_action:
      - switch.turn_off: sluit_relay
      - switch.turn_on: open_relay
    close_action:
      - if:
          condition:
            lambda: return !id(raam_open);
          then:
            - switch.turn_off: open_relay
            - switch.turn_on: sluit_relay
          else:
            - cover.stop: rolluik
    stop_action:
      - switch.turn_off: open_relay
      - switch.turn_off: sluit_relay
