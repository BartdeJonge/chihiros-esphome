substitutions:
  device_name: aquarium-tds-ph

esphome:
  name: ${device_name}

esp8266:
  board: d1_mini
  
wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: false          # Full channel scan for the best Wi-Fi signal
  power_save_mode: NONE        # Prevents the Wi-Fi module from dropping packets
  post_connect_roaming: false
  reboot_timeout: 0s
  output_power: 18.5dB         # Lowers power spikes to prevent voltage drops

logger:
  level: NONE                  # Strips logging to entirely free up GPIO3 for UART data

# NATIVE HOME ASSISTANT API IS THE EXCLUSIVE CONNECTOR
api:

  reboot_timeout: 0s
# OTA is kept active for stable wireless updates
ota:
  - platform: esphome

# Web server and MQTT blocks are completely removed to optimize CPU memory

globals:
  - id: global_ph
    type: float
    initial_value: '0.0'
  - id: global_tds
    type: float
    initial_value: '0.0'
  - id: global_temp
    type: float
    initial_value: '0.0'
  - id: last_processed_time
    type: uint32_t
    initial_value: '0'

uart:
  id: uart_bus
  rx_pin: GPIO3
  tx_pin: GPIO1                # TX freed by logger: NONE — for future reset commands
  parity: NONE
  data_bits: 8
  stop_bits: 1
  baud_rate: 9600
  debug:
    direction: RX
    dummy_receiver: true       
    after:
      bytes: 62                
    sequence:
      - lambda: |-
          if (millis() - id(last_processed_time) < 30000) {
            return;
          }

          // FIXED COMPILER SYNTAX: Added explicit [index] markers to inspect the byte vector
          if (bytes[0] == 0xFF && bytes[1] == 0xFF && bytes[2] == 0x00 && bytes[3] == 0x3A) {
            
            // FIXED MATH: Cast to 16-bit before bit-shifting to prevent value truncation
            uint16_t raw_ph = ((uint16_t)bytes[49] << 8) | bytes[50];
            float test_ph = raw_ph / 100.0;
            if (test_ph >= 0.0 && test_ph <= 14.0) {
              id(global_ph) = test_ph;
            }
            
            uint16_t raw_tds = ((uint16_t)bytes[53] << 8) | bytes[54];
            float test_tds = (float)raw_tds;
            if (test_tds >= 0.0 && test_tds <= 3000.0) { // FIXED RANGE: Protect TDS from overflow spikes
              id(global_tds) = test_tds;
            }
            
            uint16_t raw_temp = ((uint16_t)bytes[55] << 8) | bytes[56];
            float test_temp = raw_temp / 100.0;
            if (test_temp >= 0.0 && test_temp <= 50.0) {
              id(global_temp) = test_temp;
            }

            id(last_processed_time) = millis();
          }

button:
  # Soft-restart the ESP — reinitialises UART + globals, usually wakes the measurement IC
  - platform: restart
    name: "Aquarium Sensor Restart"
    id: aquarium_restart

  # TX experiment A: send the 4-byte header only — minimal "knock"
  - platform: template
    name: "Aquarium IC TX: Header only"
    id: aquarium_tx_header
    on_press:
      - uart.write:
          id: uart_bus
          data: [0xFF, 0xFF, 0x00, 0x3A]

  # TX experiment B: send full 62-byte packet (header + 58 zero bytes) — mimics a complete packet
  - platform: template
    name: "Aquarium IC TX: Full packet"
    id: aquarium_tx_full
    on_press:
      - uart.write:
          id: uart_bus
          data: [0xFF, 0xFF, 0x00, 0x3A,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  # TX experiment C: single 0xFF — common "wake" byte for many embedded sensors
  - platform: template
    name: "Aquarium IC TX: Wake byte"
    id: aquarium_tx_wake
    on_press:
      - uart.write:
          id: uart_bus
          data: [0xFF]

sensor:
  - platform: template
    name: "Aquarium pH"
    id: final_ph
    unit_of_measurement: "pH"
    icon: mdi:ph
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 30s
    lambda: |-
      if (id(global_ph) < 0.0 || (millis() - id(last_processed_time) > 90000)) return {};
      return id(global_ph);
    filters:
      - median:
          window_size: 5
          send_every: 1
      - lambda: |-
          if (x >= 4.0 && x <= 10.0) return x;
          return {}; 
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1

  - platform: template
    name: "Aquarium TDS"
    id: final_tds
    unit_of_measurement: "ppm"
    icon: mdi:water-opacity
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 30s
    lambda: |-
      if (id(global_tds) < 0.0 || (millis() - id(last_processed_time) > 90000)) return {};
      return id(global_tds);
    filters:
      # Strips out sudden, massive electrical interferences common with TDS probes
      - median:
          window_size: 5
          send_every: 1
      # Hard boundaries: Ignores pure 0ppm errors or extreme overflow values above 2000ppm
      - lambda: |-
          if (x >= 10.0 && x <= 2000.0) return x;
          return {}; 
      # Smooths out small, rapid ion fluctuations near the probe
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1

  - platform: template
    name: "Aquarium Temperature"
    id: final_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    update_interval: 30s
    lambda: |-
      if (id(global_temp) < 0.0 || (millis() - id(last_processed_time) > 90000)) return {};
      return id(global_temp);
    filters:
      # Discards instant temperature jumps caused by voltage drops
      - median:
          window_size: 5
          send_every: 1
      # Hard boundaries: 0°C = probe defect (zichtbaar in HA), max 35°C
      - lambda: |-
          if (x >= 0.0 && x <= 35.0) return x;
          return {};
      # Smooths out tiny heater/cooler cycle fluctuations over a 3-minute window
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1