substitutions:
  device_name: aquarium-voeder

esphome:
  name: ${device_name}

esp8266:
  board: esp8285
  
wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: enable
  power_save_mode: NONE
  post_connect_roaming: false
  reboot_timeout: 0s

logger:
  
api:
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
  
web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

binary_sensor:
  - platform: gpio
    id: button
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: True
    name: 'Switch feeder'
#    on_press:
#      - switch.turn_on: relay

  - platform: status
    name: "Status"

switch:
  - platform: gpio
    name: 'Relay feeder'
    id: relay
    pin: GPIO14
    on_turn_on:
      - light.turn_on: led
      - delay: 3s
      - switch.turn_off: relay
      - light.turn_off: led
    restore_mode: ALWAYS_OFF

sensor:
  - platform: pulse_meter
    pin: GPIO12
    name: 'Counter/min'
    unit_of_measurement: 'time(s)'
    internal: true
    total:
      unit_of_measurement: 'time(s)'
      name: 'Counter feeder'

output:
  - platform: esp8266_pwm
    id: blue_led
    pin:
      number: GPIO5
      inverted: true

light:
  - platform: monochromatic
    output: blue_led
    id: led